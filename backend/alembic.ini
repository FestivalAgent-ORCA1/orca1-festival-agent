# Alembic config. The DB URL is NOT written here; it is read from DATABASE_URL in .env (alembic/env.py).
# Only BE1 creates migrations and applies them to the shared DB (docs/db-schema.md).
# NOTE: keep this file ASCII-only. On Windows, alembic reads it as cp949 and fails on Korean text.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Seoul
version_path_separator = os
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
